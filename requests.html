<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - SkillSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/upwork-style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: #2D2D2D;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            background-color: transparent;
        }

        .bg-white,
        .upwork-card {
            background-color: #FFFFFF;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Page Header -->
    <div class="bg-white border-bottom py-4 mb-4" style="background-color: #FFFFFF !important;">
        <div class="container">
            <h1 class="page-title-upwork mb-1">My Requests</h1>
            <p class="page-subtitle-upwork">Manage your skill exchange proposals</p>
        </div>
    </div>

    <!-- Main Content -->
    <div style="flex: 1; background-color: #F5F5F5; min-height: calc(100vh - 200px);">
        <div class="container mb-5">
            <div class="row">
                <div class="col-lg-12">
                    <div class="upwork-card">
                        <div class="upwork-card-header">
                            <ul class="nav nav-tabs card-header-tabs" id="requestsTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="received-tab" data-bs-toggle="tab"
                                        data-bs-target="#received" type="button" role="tab">Received Requests</button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="sent-tab" data-bs-toggle="tab" data-bs-target="#sent"
                                        type="button" role="tab">Sent Requests</button>
                                </li>
                            </ul>
                        </div>
                        <div class="upwork-card-body p-0">
                            <div class="tab-content" id="requestsTabsContent">
                                <!-- Received Requests -->
                                <div class="tab-pane fade show active" id="received" role="tabpanel">
                                    <div id="receivedRequestsList" class="list-group list-group-flush">
                                        <div class="text-center py-5">
                                            <div class="spinner-border text-primary" role="status"></div>
                                            <p class="mt-2 text-muted">Loading received requests...</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- Sent Requests -->
                                <div class="tab-pane fade" id="sent" role="tabpanel">
                                    <div id="sentRequestsList" class="list-group list-group-flush">
                                        <div class="text-center py-5">
                                            <div class="spinner-border text-primary" role="status"></div>
                                            <p class="mt-2 text-muted">Loading sent requests...</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder" style="margin-top: auto; width: 100%;"></div>

    <!-- Rating Modal -->
    <div class="modal fade" id="ratingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">Rate Experience</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted mb-3">How was your experience with <strong id="ratingUserName"></strong> for
                        "<span id="ratingSkillTitle"></span>"?</p>

                    <div class="mb-4 text-center">
                        <div class="rating-stars" id="starContainer"
                            style="font-size: 2rem; color: #E0E0E0; cursor: pointer;">
                            <i class="fas fa-star" data-rating="1"></i>
                            <i class="fas fa-star" data-rating="2"></i>
                            <i class="fas fa-star" data-rating="3"></i>
                            <i class="fas fa-star" data-rating="4"></i>
                            <i class="fas fa-star" data-rating="5"></i>
                        </div>
                        <p class="text-center mt-2 fw-bold text-primary" id="ratingText"
                            style="min-height: 24px; font-size: 0.9rem;"></p>
                        <input type="hidden" id="selectedRating" value="0">
                        <div id="ratingError" class="text-danger small mt-1" style="display:none;">Please select a
                            rating</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Comment (Optional)</label>
                        <textarea class="form-control input-upwork" id="ratingComment" rows="3"
                            placeholder="Share your experience..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-upwork-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-upwork-primary" id="submitRatingBtn">Submit Review</button>
                </div>
            </div>
        </div>
    </div>

    <!-- System Status Modal (Alert/Confirm) -->
    <div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="statusModalTitle">Notification</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body py-4">
                    <p class="mb-0 text-center" id="statusModalMessage" style="font-size: 1.1rem; color: #444;"></p>
                </div>
                <div class="modal-footer border-0 pt-0 justify-content-center">
                    <button type="button" class="btn btn-upwork-secondary" data-bs-dismiss="modal"
                        id="statusModalCancel">Cancel</button>
                    <button type="button" class="btn btn-upwork-primary" id="statusModalConfirm">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/requests.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Load navbar
            fetch('assets/components/navbar.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('navbar-placeholder').innerHTML = html;
                    if (window.Auth && window.Auth.updateUI) window.Auth.updateUI();
                });

            // Load footer
            fetch('assets/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer-placeholder').innerHTML = html);
        });
    </script>
</body>

</html>
