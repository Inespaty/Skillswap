<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Manage Categories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
</head>
<body>
  <!-- Navbar -->
  <div id="navbar-placeholder"></div>
  
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h4">Category Management</h1>
      <a href="dashboard.html" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <form id="createCategoryForm" class="row g-2 align-items-center">
          <div class="col-auto">
            <input id="newCategoryName" type="text" class="form-control" placeholder="New category name" required>
          </div>
          <div class="col-auto">
            <button class="btn btn-primary" type="submit">Add Category</button>
          </div>
          <div class="col-auto ms-auto">
            <div id="adminMessage" class="text-success"></div>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h5 class="mb-3">Existing Categories</h5>
        <div class="table-responsive">
          <table class="table table-hover" id="categoriesTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Created At</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody>
              <!-- rows injected by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/navbar.js"></script>
  <script src="assets/js/admin-categories.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Load navbar
      fetch('assets/components/navbar.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('navbar-placeholder').innerHTML = html;
          if (window.Auth && window.Auth.updateUI) {
            window.Auth.updateUI();
          }
        });
      
      // Load footer
      fetch('assets/components/footer.html')
        .then(response => response.text())
        .then(html => {
          document.getElementById('footer-placeholder').innerHTML = html;
        });
    });
  </script>
</body>
</html>
