<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Skills - SkillSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/upwork-style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }
        body {
            padding-top: 0;
            background-color: #F5F5F5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        main {
            flex: 1;
        }
        .navbar {
            position: sticky;
            top: 0;
            z-index: 1030;
        }
        .browse-header {
            background: #FFFFFF;
            border-bottom: 1px solid #E0E0E0;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .browse-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .browse-header p {
            color: #64748b;
            font-size: 1rem;
            margin: 0;
        }
        .filters-section {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .filters-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: end;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        .filter-group label {
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
            display: block;
            font-size: 0.875rem;
        }
        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 0.625rem 0.875rem;
            border: 1px solid #E0E0E0;
            border-radius: 6px;
            font-size: 0.9375rem;
            color: #222222;
            background: #FFFFFF;
        }
        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #C11C84;
            box-shadow: 0 0 0 3px rgba(193, 28, 132, 0.1);
        }
        #skillsGrid {
            min-height: 400px;
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }
        .empty-state-icon {
            font-size: 4rem;
            color: #CBD5E1;
            margin-bottom: 1rem;
        }
        .empty-state-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .empty-state-text {
            color: #64748b;
            font-size: 1rem;
        }
        .loading-spinner {
            text-align: center;
            padding: 4rem 2rem;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <main>
        <!-- Header -->
        <div class="browse-header">
            <div class="container">
                <h1>Browse Skills</h1>
                <p>Discover skills offered by our community members</p>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="container">
            <div class="filters-section">
                <div class="filters-row">
                    <div class="filter-group" style="flex: 2; min-width: 300px;">
                        <label for="searchInput">
                            <i class="fas fa-search me-1"></i>Search Skills
                        </label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search by title or description...">
                    </div>
                    <div class="filter-group">
                        <label for="categorySelect">
                            <i class="fas fa-filter me-1"></i>Category
                        </label>
                        <select id="categorySelect" class="form-select">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="sortSelect">
                            <i class="fas fa-sort me-1"></i>Sort By
                        </label>
                        <select id="sortSelect" class="form-select">
                            <option value="rating">Highest Rated</option>
                            <option value="recent">Most Recent</option>
                            <option value="popular">Most Popular</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Skills Grid -->
            <div id="skillsGrid" class="row g-4">
                <div class="col-12 loading-spinner">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script>
        // Load navbar and footer
        document.addEventListener('DOMContentLoaded', function() {
            // Load navbar
            fetch('assets/components/navbar.html')
                .then(resp => resp.text())
                .then(html => {
                    document.getElementById('navbar-placeholder').innerHTML = html;
                    if (window.Navbar) {
                        window.Navbar.init();
                        window.Navbar.update();
                    }
                })
                .catch(err => console.error('Navbar load error:', err));

            // Load footer
            fetch('assets/components/footer.html')
                .then(resp => resp.text())
                .then(html => {
                    document.getElementById('footer-placeholder').innerHTML = html;
                })
                .catch(err => console.error('Footer load error:', err));
        });
    </script>
    <script src="assets/js/skills.js"></script>
</body>
</html>
