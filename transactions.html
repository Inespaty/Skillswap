<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - SkillSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/upwork-style.css">
    <style>
        body {
            background-color: #F5F5F5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .page-header {
            background: #FFFFFF;
            border-bottom: 1px solid #E0E0E0;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #222222;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #666666;
            margin: 0;
        }

        .transaction-card {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        .transaction-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-color: #C11C84;
        }

        .transaction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .transaction-type {
            font-weight: 600;
            color: #222222;
            font-size: 1rem;
        }

        .transaction-amount {
            font-weight: 700;
            font-size: 1.125rem;
        }

        .transaction-amount.credit {
            color: #10B981;
        }

        .transaction-amount.debit {
            color: #EF4444;
        }

        .transaction-details {
            color: #666666;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .transaction-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8125rem;
            color: #999999;
        }

        .filter-bar {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #FFFFFF;
            border: 1px solid #E0E0E0;
            border-radius: 8px;
            padding: 1.25rem;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #C11C84;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <main>
        <!-- Page Header -->
        <div class="page-header">
            <div class="container">
                <h1><i class="fas fa-history me-2"></i>Transaction History</h1>
                <p>View all your credit transactions and skill exchanges</p>
            </div>
        </div>

        <div class="container">
            <!-- Statistics -->
            <div class="stats-row" id="statsRow">
                <div class="stat-card">
                    <div class="stat-value" id="totalTransactions">-</div>
                    <div class="stat-label">Total Transactions</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-success" id="totalReceived">-</div>
                    <div class="stat-label">Credits Received</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value text-danger" id="totalSpent">-</div>
                    <div class="stat-label">Credits Spent</div>
                </div>
            </div>

            <!-- Filters -->
            <div class="filter-bar">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold"><i class="fas fa-filter me-1"></i>Filter by Type</label>
                        <select id="typeFilter" class="form-select input-upwork">
                            <option value="">All Types</option>
                            <option value="skill_exchange">Skill Exchange</option>
                            <option value="credit_transfer">Credit Transfer</option>
                            <option value="system_credit">System Credit</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold"><i class="fas fa-calendar me-1"></i>Time Period</label>
                        <select id="periodFilter" class="form-select input-upwork">
                            <option value="">All Time</option>
                            <option value="7">Last 7 Days</option>
                            <option value="30">Last 30 Days</option>
                            <option value="90">Last 90 Days</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold"><i class="fas fa-search me-1"></i>Search</label>
                        <input type="text" id="searchInput" class="form-control input-upwork"
                            placeholder="Search by description...">
                    </div>
                </div>
            </div>

            <!-- Transactions List -->
            <div id="transactionsList">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Loading transactions...</p>
                </div>
            </div>

            <!-- Pagination -->
            <nav id="paginationContainer" class="mt-4" style="display: none;">
                <ul class="pagination justify-content-center" id="pagination"></ul>
            </nav>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/transactions.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Load navbar
            fetch('assets/components/navbar.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('navbar-placeholder').innerHTML = html;
                    if (window.Auth && window.Auth.updateUI) window.Auth.updateUI();
                });

            // Load footer
            fetch('assets/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer-placeholder').innerHTML = html);
        });
    </script>
</body>

</html>
