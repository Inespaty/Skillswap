<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share a Skill - SkillSwap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/upwork-style.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
        }
        body {
            background-color: #2D2D2D;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .skill-edit-content {
            flex: 1;
            background-color: #F5F5F5;
        }
        .skill-edit-header {
            background: #FFFFFF;
            border-bottom: 1px solid #E0E0E0;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .skill-edit-header h1 {
            color: #222222;
        }
        .skill-edit-header p {
            color: #666666;
        }
        
        .image-preview {
            width: 100%;
            max-width: 300px;
            height: 200px;
            object-fit: cover;
            border-radius: 0.5rem;
            display: none;
            margin-top: 1rem;
        }
        
        /* Ensure form labels and inputs are visible */
        .form-label {
            color: #222222 !important;
            font-weight: 600 !important;
        }
        
        .input-upwork,
        .form-control,
        .form-select,
        textarea.input-upwork,
        input[type="text"].input-upwork,
        input[type="number"].input-upwork {
            color: #222222 !important;
            background-color: #FFFFFF !important;
        }
        
        .input-upwork::placeholder,
        .form-control::placeholder,
        textarea::placeholder {
            color: #999999 !important;
        }
        
        .form-select.input-upwork option,
        select.input-upwork option {
            color: #222222 !important;
            background-color: #FFFFFF !important;
        }
        
        /* Ensure input group text is visible */
        .input-group-text {
            color: #222222 !important;
            background-color: #F5F5F5 !important;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <!-- Header -->
    <div class="skill-edit-content">
    <div class="skill-edit-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-8 mx-auto">
                    <h1 class="page-title-upwork mb-1">Share a Skill</h1>
                    <p class="page-subtitle-upwork">List a skill you can teach others in exchange for credits</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mb-5">
        <div class="row">
            <!-- Main Form -->
            <div class="col-lg-8 mx-auto">
                <form id="skillForm" class="upwork-card">
                    <div class="upwork-card-header">
                        <h5 class="upwork-card-title mb-0">Skill Information</h5>
                    </div>
                    <div class="upwork-card-body">
                        <div class="mb-3">
                            <label for="skillTitle" class="form-label fw-bold">Skill Title *</label>
                            <input type="text" class="form-control input-upwork" id="skillTitle" placeholder="e.g., Web Development, Spanish, Photography" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="category_id" class="form-label fw-bold">Category *</label>
                            <select class="form-select input-upwork" id="category_id" name="category_id" required>
                                <option value="" disabled selected>Select a category</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="skillDescription" class="form-label fw-bold">Description *</label>
                            <textarea class="form-control input-upwork" id="skillDescription" rows="4" placeholder="Briefly describe what you can share..." required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="coverImage" class="form-label">Cover Image (optional)</label>
                            <input type="file" class="form-control input-upwork" id="coverImage" name="image" accept="image/*">
                            <img id="imagePreview" class="image-preview" alt="Preview">
                        </div>
                        
                        <div class="mb-3">
                            <label for="creditsAmount" class="form-label fw-bold">Credits Required</label>
                            <div class="input-group">
                                <input type="number" class="form-control input-upwork" id="creditsAmount" min="0" step="1" value="0">
                                <span class="input-group-text" style="background: #F5F5F5; border: 1px solid #E0E0E0;">credits</span>
                            </div>
                            <small class="text-muted">(0 = free exchange)</small>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="dashboard.html" class="btn btn-upwork-secondary">Cancel</a>
                            <button id="publishBtn" type="submit" class="btn btn-upwork-primary">Share Skill</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div id="footer-placeholder" style="margin-top: auto; width: 100%;"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/skill-edit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load navbar
            fetch('assets/components/navbar.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('navbar-placeholder').innerHTML = html;
                    // Initialize navbar after HTML is inserted
                    if (window.Auth && window.Auth.updateUI) {
                        window.Auth.updateUI();
                    }
                    if (window.Navbar && window.Navbar.update) {
                        window.Navbar.update();
                    }
                    if (window.Auth && window.Auth.protectRoute) {
                        window.Auth.protectRoute();
                    }
                })
                .catch(err => {
                    console.error('Error loading navbar:', err);
                });
            
            // Load footer
            fetch('assets/components/footer.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('footer-placeholder').innerHTML = html;
                })
                .catch(err => {
                    console.error('Error loading footer:', err);
                });
        });
    </script>
</body>
</html>
